#### Walter the Wall Buddy: fully automatic Debian install.
#### Answers every installer question so the only thing you do is boot the USB.
#### (If the laptop has no network cable, the installer will ask for your Wi-Fi.)

# Language, keyboard (also passed on the kernel command line)
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network: use whichever interface has a link; DHCP.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string walter
d-i netcfg/get_domain string local
d-i netcfg/hostname string walter
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 60
d-i hw-detect/load_firmware boolean true

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Accounts: no root login; the "walter" user gets sudo. Its password stays
# locked until you choose one on the setup page (see deploy/admin-password.sh).
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Walter the Wall Buddy
d-i passwd/username string walter
d-i passwd/user-password-crypted password !
d-i passwd/user-default-groups string audio video input plugdev netdev sudo

# Clock. The real time zone is set from your phone during setup.
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Disk: wipe the laptop's internal disk (never the USB stick we booted from).
# Before partitioning: turn off any swap the old system left behind, unmount
# its partitions and wipe the start and end of the disk (old partition tables,
# GPT backup, RAID/LVM signatures), so the installer starts from a blank disk.
# On real laptops the old swap partition otherwise made "Failed to create a
# swap space" stop the install.
#
# Then make mkfs.ext4 format with plain writes only. Some NVMe SSDs hang on
# the "write zeroes" and "discard" commands mkfs normally sends; Linux resets
# the drive, the reset fails and every later read and write fails ("Failed to
# create a file system"). Seen on a ThinkPad X1 Carbon whose SSD runs Ubuntu.
d-i partman/early_command string \
  mkdir -p /tmp/walter-real; \
  for t in mke2fs mkfs.ext4; do M="$(command -v $t)"; [ -n "$M" ] && [ ! -e /tmp/walter-real/$t ] && cat "$M" > /tmp/walter-real/$t; done; \
  for t in mke2fs mkfs.ext4; do M="$(command -v $t)"; [ -n "$M" ] && [ -e /tmp/walter-real/$t ] && ! grep -q walter-real "$M" && { \
    chmod 755 /tmp/walter-real/$t; \
    printf '%s\n' '#!/bin/sh' "echo \"$t \$*\" >> /var/log/walter-mkfs.log" 'UNIX_IO_NOZEROOUT=1' 'export UNIX_IO_NOZEROOUT' \
      "exec /tmp/walter-real/$t -E nodiscard,lazy_itable_init=0,lazy_journal_init=0 \"\$@\"" > "$M.walter"; \
    chmod 755 "$M.walter"; mv -f "$M.walter" "$M"; }; done; \
  for n in /sys/class/nvme/nvme*; do [ -e "$n/model" ] && logger -t walter "disk: $(cat $n/model) firmware $(cat $n/firmware_rev 2>/dev/null)"; done; \
  USBDEV="$(mount | grep ' /cdrom ' | cut -d' ' -f1 | sed -E 's/p?[0-9]+$//')"; \
  DISK="$(list-devices disk | grep -v "^${USBDEV:-/none}\$" | head -n1)"; \
  debconf-set partman-auto/disk "$DISK"; \
  swapoff -a 2>/dev/null; \
  for p in $(ls "$DISK"?* 2>/dev/null); do umount "$p" 2>/dev/null; swapoff "$p" 2>/dev/null; done; \
  dd if=/dev/zero of="$DISK" bs=1M count=32 2>/dev/null; \
  SZ=$(cat /sys/block/$(basename "$DISK")/size 2>/dev/null || echo 0); \
  [ "$SZ" -gt 70000 ] && dd if=/dev/zero of="$DISK" bs=512 seek=$((SZ - 65536)) count=65536 2>/dev/null; \
  sync; blockdev --rereadpt "$DISK" 2>/dev/null; true

# One big partition (plus the boot partitions the firmware needs), no swap:
# Walter doesn't need it, and it was the step that failed on real disks.
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string \
  walter :: \
    538 538 1075 free \
      $iflabel{ gpt } $reusemethod{ } \
      method{ efi } format{ } \
    . \
    1 1 1 free \
      $iflabel{ gpt } $primary{ } \
      method{ biosgrub } \
    . \
    4000 10000 -1 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    .
d-i partman-auto/choose_recipe select walter
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Packages
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string git curl sudo ca-certificates wpasupplicant avahi-daemon libnss-mdns
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader (also as the "removable" fallback path: some laptops forget EFI entries)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true
d-i debian-installer/add-kernel-opts string consoleblank=0 nvme_core.default_ps_max_latency_us=0 pcie_aspm=off intel_iommu=off amd_iommu=off

# Hand over to Walter: copy him onto the disk and arm the first-boot setup,
# which installs everything else with the network up and real systemd running.
# Also keep the installed system from sending "write zeroes"/"discard" to the
# SSD: no background inode-table zeroing, no weekly TRIM, no ext4 zero-outs.
d-i preseed/late_command string \
  cp -a /cdrom/walter /target/opt/walter-src; \
  chmod -R u+w,a+rX /target/opt/walter-src; \
  cp /target/opt/walter-src/deploy/walter-firstboot.service /target/etc/systemd/system/; \
  in-target systemctl enable walter-firstboot.service; \
  cp /var/log/walter-mkfs.log /target/var/log/ 2>/dev/null; \
  in-target sed -i -E 's@^([^#[:space:]]+[[:space:]]+/[[:space:]]+ext4[[:space:]]+)([^[:space:]]+)@\1\2,noinit_itable@' /etc/fstab; \
  in-target systemctl mask fstrim.timer; \
  printf '%s\n' 'w /sys/fs/ext4/*/extent_max_zeroout_kb - - - - 0' > /target/etc/tmpfiles.d/walter-disk.conf

# Finish without asking, and reboot into the new system.
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
