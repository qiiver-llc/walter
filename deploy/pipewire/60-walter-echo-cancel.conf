# Walter: acoustic echo cancellation (WebRTC AEC) so he can keep listening
# while he talks, and people can interrupt him mid-sentence ("barge-in").
#
# Creates two virtual devices next to the real sound card:
#   walter_aec_sink    "Walter speaker (echo-cancelled)"  - Walter plays his voice here
#   walter_aec_source  "Walter microphone (echo-cancelled)" - Walter listens here
# The module compares what goes into the sink with what the real mic hears and
# subtracts Walter's own voice from the microphone signal. Both ends follow the
# default sound card, and the system defaults are left unchanged (other apps
# are unaffected).
#
# Install (deploy/install.sh does this):
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   cp deploy/pipewire/60-walter-echo-cancel.conf ~/.config/pipewire/pipewire.conf.d/
#   cat deploy/pipewire/asoundrc-walter-aec >> ~/.asoundrc
#   systemctl --user restart pipewire wireplumber    (or reboot), then restart walter
# Check:  wpctl status   (look for walter_aec_sink / walter_aec_source)
# Walter finds the devices himself ([ears] barge_in = "auto"); remove this
# file (and restart PipeWire) to go back to the old "mute while talking".
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            node.latency  = 1024/48000
            monitor.mode  = false
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control     = false  # keep whisper's levels predictable
            }
            capture.props = {
                node.name    = "walter_aec.capture"
                node.passive = true
            }
            source.props = {
                node.name        = "walter_aec_source"
                node.description = "Walter microphone (echo-cancelled)"
            }
            sink.props = {
                node.name        = "walter_aec_sink"
                node.description = "Walter speaker (echo-cancelled)"
            }
            playback.props = {
                node.name    = "walter_aec.playback"
                node.passive = true
            }
        }
    }
]
